<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="1600" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Consolas', 'Monaco', 'Courier New', monospace; background-color: #1A1A1D;">

    <script type="text/javascript">
    <![CDATA[
    function copyToClipboard(elementId) {
        var text = document.getElementById(elementId).textContent;
        // Decode base64 if we use it, but plain text is easier if escaped. 
        // Let's assume standard text content for now, maybe base64 decoded if needed.
        // Actually, let's use base64 to avoid escaping hell in attributes.
        var decoded = atob(text);
        
        navigator.clipboard.writeText(decoded).then(function() {
            console.log('Copying to clipboard was successful!');
            alert('Example copied to clipboard!');
        }, function(err) {
            console.error('Could not copy text: ', err);
            alert('Failed to copy. ' + err);
        });
    }
    ]]>
    </script>
    <text x="600.0" y="60" font-size="40" fill="#E0E0E0" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Arial', sans-serif">SysML v2 Cheat Sheet: VIEWS &amp; VIEWPOINTS</text><text x="600.0" y="100" font-size="20" fill="#A0A0A0" font-weight="normal" text-anchor="middle" >Theme: dark</text><rect x="40" y="150" width="560" height="195" fill="#2C2C30" rx="10" ry="10"  /><text x="60" y="185" font-size="24" fill="#8BE9FD" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">1. View Definition</text><text id="code_91c862469f3f41588a198c84f83b61e0" style="display:none;">cGFja2FnZSBWaWV3cyB7CiAgICBwYXJ0IGRlZiBTeXN0ZW07CiAgICAKICAgIHZpZXcgZGVmIFJlcG9ydFZpZXcgewogICAgICAgIC8qIElucHV0IHBhcmFtZXRlciBmb3Igc3ViamVjdCAqLwogICAgICAgIGluIHN1YmplY3QgOiBTeXN0ZW07CiAgICB9Cn0=</text><g onclick="copyToClipboard('code_91c862469f3f41588a198c84f83b61e0')" style="cursor: pointer;"><title>package Views {
