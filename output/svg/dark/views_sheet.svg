    }
}</title><rect x="520" y="160" width="70" height="30" fill="#FF79C6" rx="5" ry="5"  /><text x="555" y="180" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="60" y="220" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">view def ReportView {</text><text x="60" y="245" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    in part subject;</text><text x="60" y="270" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">}</text><text x="60" y="315" font-size="16" fill="#A0A0A0" font-weight="italic" text-anchor="start" >Defines a reusable view structure.</text><rect x="40" y="365" width="560" height="195" fill="#2C2C30" rx="10" ry="10"  /><text x="60" y="400" font-size="24" fill="#8BE9FD" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">2. View Usage</text><text id="code_e90e4faea82f4a94976bbf4b3b6d9ce7" style="display:none;">cGFja2FnZSBWaWV3cyB7CiAgICBwYXJ0IGRlZiBTeXN0ZW07CiAgICBwYXJ0IG15U3lzdGVtIDogU3lzdGVtOyAKICAgIHZpZXcgZGVmIFJlcG9ydFZpZXcgeyBpbiBzdWJqZWN0IDogU3lzdGVtOyB9CiAgICAKICAgIC8qIFZpZXcgVXNhZ2UgKi8KICAgIHZpZXcgcmVwb3J0IDogUmVwb3J0VmlldyB7CiAgICAgICAgaW4gc3ViamVjdCA9IG15U3lzdGVtOwogICAgfQp9</text><g onclick="copyToClipboard('code_e90e4faea82f4a94976bbf4b3b6d9ce7')" style="cursor: pointer;"><title>package Views {
    part def System;
    part mySystem : System; 
    view def ReportView { in subject : System; }
    
    /* View Usage */
    view report : ReportView {
        in subject = mySystem;
    }
}</title><rect x="520" y="375" width="70" height="30" fill="#FF79C6" rx="5" ry="5"  /><text x="555" y="395" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="60" y="435" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">view report : ReportView {</text><text x="60" y="460" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    in subject = mySystem;</text><text x="60" y="485" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">}</text><text x="60" y="530" font-size="16" fill="#A0A0A0" font-weight="italic" text-anchor="start" >A concrete usage of a view definition.</text><rect x="40" y="580" width="560" height="220" fill="#2C2C30" rx="10" ry="10"  /><text x="60" y="615" font-size="24" fill="#8BE9FD" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">3. Viewpoint</text><text id="code_1525911a2d3441a5a102649b671cad13" style="display:none;"></text><g onclick="copyToClipboard('code_1525911a2d3441a5a102649b671cad13')" style="cursor: pointer;"><title>package Views {
    /* 1. Define specific concern/perspective */
    viewpoint def SafetyAnalysis {
        doc &quot;Focus on hazards.&quot;;
    }
    
    /* 2. Link view to viewpoint */
    view def SafetyView {
        satisfies SafetyAnalysis;
    }
}</title><rect x="520" y="590" width="70" height="30" fill="#FF79C6" rx="5" ry="5"  /><text x="555" y="610" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="60" y="650" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">viewpoint def SafetyAnalysis;</text><text x="60" y="675" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">view def SafetyView {</text><text x="60" y="700" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    satisfies SafetyAnalysis;</text><text x="60" y="725" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">}</text><text x="60" y="770" font-size="16" fill="#A0A0A0" font-weight="italic" text-anchor="start" >Viewpoints define the rules/frame of concern.</text><rect x="640" y="150" width="560" height="220" fill="#2C2C30" rx="10" ry="10"  /><text x="660" y="185" font-size="24" fill="#8BE9FD" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">4. Expose Content</text><text id="code_5d8eeb7a20784cb1a8394fbce80541d0" style="display:none;"></text><g onclick="copyToClipboard('code_5d8eeb7a20784cb1a8394fbce80541d0')" style="cursor: pointer;"><title>package Views {
    part def Car { part engine; part wheels[4]; }
    part myCar : Car;
    
    view myView {
        /* Expose specific element */
        expose myCar;
        
        /* Expose element and all children recursively */
        expose myCar::**; 
    }
}</title><rect x="1120" y="160" width="70" height="30" fill="#FF79C6" rx="5" ry="5"  /><text x="1155" y="180" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="660" y="220" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">view myView {</text><text x="660" y="245" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    expose myPart;</text><text x="660" y="270" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    expose myPart::**;</text><text x="660" y="295" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">}</text><text x="660" y="340" font-size="16" fill="#A0A0A0" font-weight="italic" text-anchor="start" >Explicitly includes elements in the view.</text><rect x="640" y="390" width="560" height="220" fill="#2C2C30" rx="10" ry="10"  /><text x="660" y="425" font-size="24" fill="#8BE9FD" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">5. Filter</text><text id="code_a8db6842318b4d59b272bfa704002ce7" style="display:none;"></text><g onclick="copyToClipboard('code_a8db6842318b4d59b272bfa704002ce7')" style="cursor: pointer;"><title>package Views {
