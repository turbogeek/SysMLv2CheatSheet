<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1400" height="1300" viewBox="0 0 1400 1300" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Consolas', 'Monaco', 'Courier New', monospace; background-color: #1A1A1D;">

    <script type="text/javascript">
    <![CDATA[
    function copyToClipboard(elementId) {
        var text = document.getElementById(elementId).textContent;
        // Decode base64 if we use it, but plain text is easier if escaped. 
        // Let's assume standard text content for now, maybe base64 decoded if needed.
        // Actually, let's use base64 to avoid escaping hell in attributes.
        var decoded = atob(text);
        
        navigator.clipboard.writeText(decoded).then(function() {
            console.log('Copying to clipboard was successful!');
            alert('Example copied to clipboard!');
        }, function(err) {
            console.error('Could not copy text: ', err);
            alert('Failed to copy. ' + err);
        });
    }
    ]]>
    </script>
    <text x="700.0" y="60" font-size="40" fill="#E0E0E0" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Arial', sans-serif">SysML v2 Cheat Sheet: CORE TYPES</text><text x="700.0" y="100" font-size="20" fill="#A0A0A0" font-weight="normal" text-anchor="middle" >Theme: dark</text><rect x="30" y="150" width="660.0" height="270" fill="#2C2C30" rx="10" ry="10"  /><text x="50" y="185" font-size="24" fill="#8BE9FD" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">1. Part vs. Item</text><text id="code_777085b052ad4b5da2faac6a4a5597b5" style="display:none;"></text><g onclick="copyToClipboard('code_777085b052ad4b5da2faac6a4a5597b5')" style="cursor: pointer;"><title>package CoreTypes_1PartItems {
    // A Part occupies space and time
    part def Engine {
        // Parts can contain other parts
        part cylinder;
    }
    
    // An Item is information or substance flow (no structure)
    item def TorqueCommand;
    
    part car {
        part myEngine : Engine;
        // Items often flow between parts
        item currentCmd : TorqueCommand;
    }
}</title><rect x="610.0" y="160" width="70" height="30" fill="#FF79C6" rx="5" ry="5"  /><text x="645.0" y="180" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="50" y="220" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Part</text><text x="88.4" y="220" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : Physical/Logical entity (Space/Time)</text><text x="50" y="245" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Item</text><text x="88.4" y="245" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : Pure Information/Logical flow</text><text x="50" y="270" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Rule:</text><text x="98.0" y="270" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> Parts have mass/energy, Items do not.</text><text x="50" y="295" font-size="16" fill="#50FA7B" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="italic" xml:space="preserve">Usage:</text><text x="50" y="320" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  part eng : Engine;</text><text x="50" y="345" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  item cmd : TorqueCommand;</text><text x="50" y="390" font-size="16" fill="#A0A0A0" font-weight="italic" text-anchor="start" >Physical Structure vs. Information.</text><rect x="30" y="440" width="660.0" height="220" fill="#2C2C30" rx="10" ry="10"  /><text x="50" y="475" font-size="24" fill="#8BE9FD" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">2. Attributes &amp; Scalars</text><text id="code_3ba1e7071b114f1380da16efadb05f86" style="display:none;"></text><g onclick="copyToClipboard('code_3ba1e7071b114f1380da16efadb05f86')" style="cursor: pointer;"><title>package CoreTypes_2Attributes {
    // 1. Define the Scalar (Primitive Type)
    scalar def Kilogram;
    
    // 2. Define the Attribute Concept (Property)
    attribute def Mass {
        attribute val : Kilogram;
    }
    
    part def Rocket;
    
    part myRocket : Rocket {
        // 3. Use the Attribute
        attribute dryMass : Mass = 5000;
        
        // Or simple usage with standard types
        attribute name : String = &quot;Falcon&quot;;
    }
}</title><rect x="610.0" y="450" width="70" height="30" fill="#FF79C6" rx="5" ry="5"  /><text x="645.0" y="470" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="50" y="510" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">attribute</text><text x="136.39999999999998" y="510" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : Carries a value (No independent identity)</text><text x="50" y="535" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">scalar</text><text x="107.6" y="535" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    : Defines the raw type (Real, String...)</text><text x="50" y="560" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Structure:</text><text x="50" y="585" font-size="16" fill="#50FA7B" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="italic" xml:space="preserve">  scalar def -&gt; attribute def -&gt; usage</text><text x="50" y="630" font-size="16" fill="#A0A0A0" font-weight="italic" text-anchor="start" >Defining and using data values.</text><rect x="710.0" y="150" width="660.0" height="195" fill="#2C2C30" rx="10" ry="10"  /><text x="730.0" y="185" font-size="24" fill="#8BE9FD" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">3. Enumerations</text><text id="code_c3ab5892f21f404b9b5f810e016d98b9" style="display:none;"></text><g onclick="copyToClipboard('code_c3ab5892f21f404b9b5f810e016d98b9')" style="cursor: pointer;"><title>package CoreTypes_3Enums {
    enum def TrafficColor {
        enum Red;
        enum Yellow;
        enum Green;
    }
    
    part trafficLight {
        attribute state : TrafficColor;
    }
    
    // Assigning an enum value
    part intersection {
        part light1 : trafficLight {
             attribute :&gt;&gt; state = TrafficColor::Red;
        }
    }
}</title><rect x="1290.0" y="160" width="70" height="30" fill="#FF79C6" rx="5" ry="5"  /><text x="1325.0" y="180" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="730.0" y="220" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">enum def</text><text x="806.8" y="220" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : Define a set of valid literals</text><text x="730.0" y="245" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Useful for states, modes, options</text><text x="730.0" y="270" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Example:</text><text x="806.8" y="270" font-size="16" fill="#F1FA8C" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> Red, Yellow, Green</text><text x="730.0" y="315" font-size="16" fill="#A0A0A0" font-weight="italic" text-anchor="start" >Predefined sets of values.</text><rect x="710.0" y="365" width="660.0" height="220" fill="#2C2C30" rx="10" ry="10"  /><text x="730.0" y="400" font-size="24" fill="#8BE9FD" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">4. Integrated Example</text><text id="code_2a590d56d8bf47a3bae0fce28300f750" style="display:none;"></text><g onclick="copyToClipboard('code_2a590d56d8bf47a3bae0fce28300f750')" style="cursor: pointer;"><title>package CoreTypes_4Integrated {
    import ScalarValues::Real;
    
    scalar def Percent;
    
    item def Fuel;
    
    part def Tank {
        attribute level : Percent; 
        attribute capacity : Real;
    }
    
    part fuelSystem {
        part mainTank : Tank {
            attribute :&gt;&gt; level = 85.5;
            attribute :&gt;&gt; capacity = 50.0;
        }
        
        // Item existing within component
        item currentFuel : Fuel;
    }
}</title><rect x="1290.0" y="375" width="70" height="30" fill="#FF79C6" rx="5" ry="5"  /><text x="1325.0" y="395" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="730.0" y="435" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Composition:</text><text x="845.2" y="435" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> Parts composed of attributes (vals)</text><text x="730.0" y="460" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Flows:</text><text x="787.6" y="460" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> Items flow, Parts execute</text><text x="730.0" y="485" font-size="16" fill="#FF79C6" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">The Core:</text><text x="816.4" y="485" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> Almost everything in SysML v2 extends</text><text x="730.0" y="510" font-size="16" fill="#E0E0E0" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">from these core types.</text><text x="730.0" y="555" font-size="16" fill="#A0A0A0" font-weight="italic" text-anchor="start" >Combining Structural Concepts.</text><rect x="450.0" y="1220" width="500" height="50" fill="#2C2C30" rx="5" ry="5"  /><text x="470.0" y="1250" font-size="16" fill="#E0E0E0" font-weight="bold" text-anchor="start" >Key:</text><text x="520.0" y="1250" font-size="16" fill="#FF79C6" font-weight="bold" text-anchor="start" >Keyword</text><text x="620.0" y="1250" font-size="16" fill="#8BE9FD" font-weight="bold" text-anchor="start" >Type</text><text x="690.0" y="1250" font-size="16" fill="#F1FA8C" font-weight="bold" text-anchor="start" >String</text><text x="780.0" y="1250" font-size="16" fill="#50FA7B" font-weight="bold" text-anchor="start" >Comment</text><text x="880.0" y="1250" font-size="16" fill="#E0E0E0" font-weight="bold" text-anchor="start" >Normal</text></svg>