<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1400" height="1300" viewBox="0 0 1400 1300" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Consolas', 'Monaco', 'Courier New', monospace; background-color: #FFF0F5;">

    <script type="text/javascript">
    <![CDATA[
    function copyToClipboard(elementId) {
        var text = document.getElementById(elementId).textContent;
        // Decode base64 if we use it, but plain text is easier if escaped. 
        // Let's assume standard text content for now, maybe base64 decoded if needed.
        // Actually, let's use base64 to avoid escaping hell in attributes.
        var decoded = atob(text);
        
        navigator.clipboard.writeText(decoded).then(function() {
            console.log('Copying to clipboard was successful!');
            alert('Example copied to clipboard!');
        }, function(err) {
            console.error('Could not copy text: ', err);
            alert('Failed to copy. ' + err);
        });
    }
    ]]>
    </script>
    
<image href="../assets/howdy_kitty_branding.png" x="1025" y="25" width="150" height="150" />
<text x="700.0" y="60" font-size="40" fill="#FF69B4" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Arial', sans-serif">SysML v2 Cheat Sheet: SEMANTIC METADATA (DSL)</text><text x="700.0" y="100" font-size="20" fill="#FF1493" font-weight="normal" text-anchor="middle" >Theme: howdy_kitty</text><rect x="30" y="150" width="660.0" height="195" fill="#FFFFFF" rx="10" ry="10"  /><text x="50" y="185" font-size="24" fill="#9370DB" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">1. Domain Library</text><text id="code_671ba676ae84436d9dfe8dfb6832e77e" style="display:none;"></text><g onclick="copyToClipboard('code_671ba676ae84436d9dfe8dfb6832e77e')" style="cursor: pointer;"><title>package Vehicle_Library {
    part def Vehicle;
    part def engines;
    part def wheels;
    interface def driveTrains;
    
    // Standard Ports for connections
    part def EnginePart :&gt; engines { port enginePort; }
    part def WheelPart :&gt; wheels { port wheelPort; }
}</title><rect x="610.0" y="160" width="70" height="30" fill="#FF00FF" rx="5" ry="5"  /><text x="645.0" y="180" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="50" y="220" font-size="16" fill="#32CD32" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="italic" xml:space="preserve">Pre-requisite:</text><text x="184.4" y="220" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> Define your domain concepts first.</text><text x="50" y="245" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">These are standard SysML definitions.</text><text x="50" y="270" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Metadata will map to these concepts.</text><text x="50" y="315" font-size="16" fill="#FF1493" font-weight="italic" text-anchor="start" >The vocabulary we want to use.</text><rect x="30" y="365" width="660.0" height="220" fill="#FFFFFF" rx="10" ry="10"  /><text x="50" y="400" font-size="24" fill="#9370DB" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">2. Defining Metadata</text><text id="code_a7bf116933a440f2afebc7afc408cd58" style="display:none;"></text><g onclick="copyToClipboard('code_a7bf116933a440f2afebc7afc408cd58')" style="cursor: pointer;"><title>package Vehicle_Metadata {
    private import Vehicle_Library::*;
    private import Metaobjects::SemanticMetadata;

    // Define &#x27;drive&#x27; metadata mapping to &#x27;driveTrains&#x27; interface
    metadata def drive specializes SemanticMetadata {
        redefines baseType = driveTrains meta SysML::Usage;
        subsets annotatedElement : SysML::InterfaceUsage;
    }
    
    // Define &#x27;engine&#x27; metadata mapping to &#x27;engines&#x27; part
    metadata def engine specializes SemanticMetadata {
        redefines baseType = engines meta SysML::Usage;
        subsets annotatedElement : SysML::Usage;
    }

    metadata def wheel specializes SemanticMetadata {
        redefines baseType = wheels meta SysML::Usage;
        subsets annotatedElement : SysML::Usage;
    }

    // Define &#x27;vehicle&#x27; metadata mapping to &#x27;Vehicle&#x27; definition
    metadata def vehicle specializes SemanticMetadata {
        redefines baseType = Vehicle meta SysML::Definition;
        subsets annotatedElement : SysML::Definition;
    }
}</title><rect x="610.0" y="375" width="70" height="30" fill="#FF00FF" rx="5" ry="5"  /><text x="645.0" y="395" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="50" y="435" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">metadata def</text><text x="165.2" y="435" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : Defines a new annotation type.</text><text x="50" y="460" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">specializes SemanticMetadata</text><text x="318.8" y="460" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : Required for semantic mapping.</text><text x="50" y="485" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">baseType</text><text x="126.8" y="485" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : The Domain Concept this metadata represents.</text><text x="50" y="510" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">annotatedElement</text><text x="203.6" y="510" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : Where this metadata can be applied.</text><text x="50" y="555" font-size="16" fill="#FF1493" font-weight="italic" text-anchor="start" >Mapping keywords to concepts.</text><rect x="710.0" y="150" width="660.0" height="270" fill="#FFFFFF" rx="10" ry="10"  /><text x="730.0" y="185" font-size="24" fill="#9370DB" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">3. Using the DSL</text><text id="code_29df3c149e1d41ff827cc8b9b68ca17f" style="display:none;"></text><g onclick="copyToClipboard('code_29df3c149e1d41ff827cc8b9b68ca17f')" style="cursor: pointer;"><title>package Car_Example {
    private import Vehicle_Metadata::*;

    // Using the DSL!
    // #vehicle implies &#x27;part def Car :&gt; Vehicle&#x27;
    #vehicle def Car {
        
        // #engine implies &#x27;part carEngine :&gt; engines&#x27;
        #engine carEngine[1];
        
        #wheel carWheels[4];
        
        // #drive implies &#x27;interface ... :&gt; driveTrains&#x27;
        #drive interface connect [1] carEngine.enginePort 
                              to [2] carWheels.wheelPort;
    }
}</title><rect x="1290.0" y="160" width="70" height="30" fill="#FF00FF" rx="5" ry="5"  /><text x="1325.0" y="180" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="730.0" y="220" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">#hash</text><text x="778.0" y="220" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> syntax applies the metadata.</text><text x="730.0" y="245" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">The parser treats:</text><text x="730.0" y="270" font-size="16" fill="#FF6347" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  #vehicle def Car</text><text x="730.0" y="295" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">as equivalent to:</text><text x="730.0" y="320" font-size="16" fill="#FF6347" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  part def Car :&gt; Vehicle</text><text x="730.0" y="345" font-size="16" fill="#32CD32" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="italic" xml:space="preserve">(plus semantic tagging)</text><text x="730.0" y="390" font-size="16" fill="#FF1493" font-weight="italic" text-anchor="start" >Writing concise, domain-specific code.</text><rect x="710.0" y="440" width="660.0" height="270" fill="#FFFFFF" rx="10" ry="10"  /><text x="730.0" y="475" font-size="24" fill="#9370DB" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">4. Behind the Scenes</text><text id="code_61d109c0396440bab125c0d7f6b60372" style="display:none;"></text><g onclick="copyToClipboard('code_61d109c0396440bab125c0d7f6b60372')" style="cursor: pointer;"><title>// Conceptual view of what happens under the hood
// When you write:
// #engine myEngine;

// It effectively becomes:
// @engine
// part myEngine :&gt; engines;

// Where @engine links back to the metadata definition
// allowing tools to know &quot;This part IS an engine&quot;
// regardless of inheritance hierarchy complexities.</title><rect x="1290.0" y="450" width="70" height="30" fill="#FF00FF" rx="5" ry="5"  /><text x="1325.0" y="470" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="730.0" y="510" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">meta</text><text x="768.4" y="510" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> keyword: explicit reference to a metaclass.</text><text x="730.0" y="535" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  e.g., meta SysML::Usage</text><text x="730.0" y="560" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Benefits:</text><text x="730.0" y="585" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  1. Concise syntax (#engine vs part :&gt; engine)</text><text x="730.0" y="610" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  2. Semantic Validation (only engines here)</text><text x="730.0" y="635" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  3. Tooling (custom views/generators)</text><text x="730.0" y="680" font-size="16" fill="#FF1493" font-weight="italic" text-anchor="start" >Why do this?</text><rect x="450.0" y="1220" width="500" height="50" fill="#FFFFFF" rx="5" ry="5"  /><text x="470.0" y="1250" font-size="16" fill="#FF69B4" font-weight="bold" text-anchor="start" >Key:</text><text x="520.0" y="1250" font-size="16" fill="#FF00FF" font-weight="bold" text-anchor="start" >Keyword</text><text x="620.0" y="1250" font-size="16" fill="#9370DB" font-weight="bold" text-anchor="start" >Type</text><text x="690.0" y="1250" font-size="16" fill="#FF6347" font-weight="bold" text-anchor="start" >String</text><text x="780.0" y="1250" font-size="16" fill="#32CD32" font-weight="bold" text-anchor="start" >Comment</text><text x="880.0" y="1250" font-size="16" fill="#FF69B4" font-weight="bold" text-anchor="start" >Normal</text></svg>