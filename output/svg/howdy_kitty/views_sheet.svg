<text x="600.0" y="60" font-size="40" fill="#FF69B4" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Arial', sans-serif">SysML v2 Cheat Sheet: VIEWS &amp; VIEWPOINTS</text><text x="600.0" y="100" font-size="20" fill="#FF1493" font-weight="normal" text-anchor="middle" >Theme: howdy_kitty</text><rect x="40" y="150" width="560" height="195" fill="#FFFFFF" rx="10" ry="10"  /><text x="60" y="185" font-size="24" fill="#9370DB" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">1. View Definition</text><text id="code_d1da29b269e14c30883c2114b1912341" style="display:none;">cGFja2FnZSBWaWV3cyB7CiAgICBwYXJ0IGRlZiBTeXN0ZW07CiAgICAKICAgIHZpZXcgZGVmIFJlcG9ydFZpZXcgewogICAgICAgIC8qIElucHV0IHBhcmFtZXRlciBmb3Igc3ViamVjdCAqLwogICAgICAgIGluIHN1YmplY3QgOiBTeXN0ZW07CiAgICB9Cn0=</text><g onclick="copyToClipboard('code_d1da29b269e14c30883c2114b1912341')" style="cursor: pointer;"><title>package Views {
    part def System;
    
    view def ReportView {
        /* Input parameter for subject */
        in subject : System;
    }
}</title><rect x="520" y="160" width="70" height="30" fill="#FF00FF" rx="5" ry="5"  /><text x="555" y="180" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="60" y="220" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">view def ReportView {</text><text x="60" y="245" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    in part subject;</text><text x="60" y="270" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">}</text><text x="60" y="315" font-size="16" fill="#FF1493" font-weight="italic" text-anchor="start" >Defines a reusable view structure.</text><rect x="40" y="365" width="560" height="195" fill="#FFFFFF" rx="10" ry="10"  /><text x="60" y="400" font-size="24" fill="#9370DB" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">2. View Usage</text><text id="code_73df26954002493d8f611aae3f8de2e7" style="display:none;">cGFja2FnZSBWaWV3cyB7CiAgICBwYXJ0IGRlZiBTeXN0ZW07CiAgICBwYXJ0IG15U3lzdGVtIDogU3lzdGVtOyAKICAgIHZpZXcgZGVmIFJlcG9ydFZpZXcgeyBpbiBzdWJqZWN0IDogU3lzdGVtOyB9CiAgICAKICAgIC8qIFZpZXcgVXNhZ2UgKi8KICAgIHZpZXcgcmVwb3J0IDogUmVwb3J0VmlldyB7CiAgICAgICAgaW4gc3ViamVjdCA9IG15U3lzdGVtOwogICAgfQp9</text><g onclick="copyToClipboard('code_73df26954002493d8f611aae3f8de2e7')" style="cursor: pointer;"><title>package Views {
    part def System;
    part mySystem : System; 
    view def ReportView { in subject : System; }
    
    /* View Usage */
    view report : ReportView {
        in subject = mySystem;
    }
}</title><rect x="520" y="375" width="70" height="30" fill="#FF00FF" rx="5" ry="5"  /><text x="555" y="395" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="60" y="435" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">view report : ReportView {</text><text x="60" y="460" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    in subject = mySystem;</text><text x="60" y="485" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">}</text><text x="60" y="530" font-size="16" fill="#FF1493" font-weight="italic" text-anchor="start" >A concrete usage of a view definition.</text><rect x="40" y="580" width="560" height="245" fill="#FFFFFF" rx="10" ry="10"  /><text x="60" y="615" font-size="24" fill="#9370DB" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">3. Viewpoint</text><text id="code_da3266f051774246ae86a51aebfa7416" style="display:none;"></text><g onclick="copyToClipboard('code_da3266f051774246ae86a51aebfa7416')" style="cursor: pointer;"><title>package Views {
    /* 1. Define specific concern/perspective */
    viewpoint def SafetyAnalysis {
        doc &quot;Focus on hazards.&quot;;
    }
    
    /* 2. Create viewpoint usage */
    viewpoint &lt;&#x27;vp1&#x27;&gt; &#x27;sa&#x27; : SafetyAnalysis;
    
    /* 3. Link view usage to viewpoint usage */
    view mySafetyView {
        satisfy &#x27;sa&#x27;;
    }
}</title><rect x="520" y="590" width="70" height="30" fill="#FF00FF" rx="5" ry="5"  /><text x="555" y="610" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="60" y="650" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">viewpoint def SafetyAnalysis;</text><text x="60" y="675" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">viewpoint &lt;&#x27;v1&#x27;&gt; &#x27;sa&#x27; : SafetyAnalysis;</text><text x="60" y="700" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">view myView {</text><text x="60" y="725" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    satisfy &#x27;sa&#x27;;</text><text x="60" y="750" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">}</text><text x="60" y="795" font-size="16" fill="#FF1493" font-weight="italic" text-anchor="start" >Viewpoints define the rules/frame of concern.</text><rect x="640" y="150" width="560" height="220" fill="#FFFFFF" rx="10" ry="10"  /><text x="660" y="185" font-size="24" fill="#9370DB" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">4. Expose Content</text><text id="code_2cc8f450cd2447eab87cac866a43afd0" style="display:none;"></text><g onclick="copyToClipboard('code_2cc8f450cd2447eab87cac866a43afd0')" style="cursor: pointer;"><title>package Views {
    part def Car { part engine; part wheels[4]; }
    part myCar : Car;
    
    view myView {
        /* Expose specific element */
        expose myCar;
        
        /* Expose element and all children recursively */
        expose myCar::**; 
    }
}</title><rect x="1120" y="160" width="70" height="30" fill="#FF00FF" rx="5" ry="5"  /><text x="1155" y="180" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="660" y="220" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">view myView {</text><text x="660" y="245" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    expose myPart;</text><text x="660" y="270" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    expose myPart::**;</text><text x="660" y="295" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">}</text><text x="660" y="340" font-size="16" fill="#FF1493" font-weight="italic" text-anchor="start" >Explicitly includes elements in the view.</text><rect x="640" y="390" width="560" height="220" fill="#FFFFFF" rx="10" ry="10"  /><text x="660" y="425" font-size="24" fill="#9370DB" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">5. Filter</text><text id="code_5a4d15e8265c47308fad4ffeea1e0676" style="display:none;"></text><g onclick="copyToClipboard('code_5a4d15e8265c47308fad4ffeea1e0676')" style="cursor: pointer;"><title>package Views {
    private import ScalarValues::*;
    part def Car;
    part myCar : Car;
    
    view myView {
        expose myCar::**;
        
        /* Keep only Parts */
        filter @PartUsage;
        
        /* Keep only Allocations (CRITICAL: use Usage, not Definition) */
        filter @AllocationUsage;
        
        /* Or exclude specific things (logic depends on library) */
    }
}</title><rect x="1120" y="400" width="70" height="30" fill="#FF00FF" rx="5" ry="5"  /><text x="1155" y="420" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="660" y="460" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">view myView {</text><text x="660" y="485" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    filter @Part;</text><text x="660" y="510" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    filter @Action;</text><text x="660" y="535" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">}</text><text x="660" y="580" font-size="16" fill="#FF1493" font-weight="italic" text-anchor="start" >Filter included elements by criteria.</text><rect x="640" y="630" width="560" height="220" fill="#FFFFFF" rx="10" ry="10"  /><text x="660" y="665" font-size="24" fill="#9370DB" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">6. Rendering &amp; Style</text><text id="code_b860225b58be49a6bb3ee054d5d62f83" style="display:none;"></text><g onclick="copyToClipboard('code_b860225b58be49a6bb3ee054d5d62f83')" style="cursor: pointer;"><title>package Views {
    /* Assuming standard libraries available */
    view def MyView {
        /* Apply visual style */
        style color = &quot;blue&quot;;
        
        /* Define table structure */
        render asTable {
           /* table details */
        }
    }
}</title><rect x="1120" y="640" width="70" height="30" fill="#FF00FF" rx="5" ry="5"  /><text x="1155" y="660" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="660" y="700" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">view myView {</text><text x="660" y="725" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    render asTable { ... }</text><text x="660" y="750" font-size="16" fill="#FF69B4" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    style color = &#x27;red&#x27;;</text><text x="660" y="775" font-size="16" fill="#FF00FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">}</text><text x="660" y="820" font-size="16" fill="#FF1493" font-weight="italic" text-anchor="start" >Apply rendering styles or presentation modes.</text><rect x="350.0" y="1520" width="500" height="50" fill="#FFFFFF" rx="5" ry="5"  /><text x="370.0" y="1550" font-size="16" fill="#FF69B4" font-weight="bold" text-anchor="start" >Key:</text><text x="420.0" y="1550" font-size="16" fill="#FF00FF" font-weight="bold" text-anchor="start" >Keyword</text><text x="520.0" y="1550" font-size="16" fill="#9370DB" font-weight="bold" text-anchor="start" >Type</text><text x="590.0" y="1550" font-size="16" fill="#FF6347" font-weight="bold" text-anchor="start" >String</text><text x="680.0" y="1550" font-size="16" fill="#32CD32" font-weight="bold" text-anchor="start" >Comment</text><text x="780.0" y="1550" font-size="16" fill="#FF69B4" font-weight="bold" text-anchor="start" >Normal</text></svg>