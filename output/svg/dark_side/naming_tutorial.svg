<text x="700.0" y="60" font-size="40" fill="#FFE81F" font-weight="bold" text-anchor="middle" font-family="'Century Gothic', 'Verdana', sans-serif">SysML v2 Cheat Sheet: NAMES &amp; IMPORTS</text><text x="700.0" y="100" font-size="20" fill="#FF0000" font-weight="normal" text-anchor="middle" >Theme: dark_side</text><rect x="30" y="150" width="660.0" height="295" fill="#111111" rx="10" ry="10"  /><text x="50" y="185" font-size="24" fill="#FFE81F" font-weight="bold" text-anchor="start" font-family="'Century Gothic', 'Verdana', sans-serif">1. Naming &amp; Identifiers</text><text id="code_712c2e720aa441e68e6209be434f7328" style="display:none;"></text><g onclick="copyToClipboard('code_712c2e720aa441e68e6209be434f7328')" style="cursor: pointer;"><title>package Naming_1Identifiers {
    part def VehiclePart;      // PascalCase for Definitions
    part myEngine : VehiclePart; // camelCase for Usages
    
    // Escaped identifiers for special chars or keywords
    part &#x27;123-Start&#x27;; 
    part &#x27;Space Name&#x27;;
    
    // Avoid name collisions with keywords
    // part type; // Error: &#x27;type&#x27; is reserved
}</title><rect x="610.0" y="160" width="70" height="30" fill="#FF0000" rx="5" ry="5"  /><text x="645.0" y="180" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="50" y="220" font-size="16" fill="#FF0000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Standard</text><text x="126.8" y="220" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : alphanumeric + _ (start with letter/_) </text><text x="50" y="245" font-size="16" fill="#FF0000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Escaped</text><text x="117.2" y="245" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  : &#x27;Single Quoted&#x27; (allows spaces/symbols)</text><text x="50" y="270" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">SysML</text><text x="98.0" y="270" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> is </text><text x="136.4" y="270" font-size="16" fill="#FF0000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Case Sensitive</text><text x="50" y="295" font-size="16" fill="#888888" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="italic" xml:space="preserve">Conventions:</text><text x="50" y="320" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  PartDef</text><text x="136.39999999999998" y="320" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> (PascalCase) - Definitions</text><text x="50" y="345" font-size="16" fill="#FFFFFF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  myPart</text><text x="126.8" y="345" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  (camelCase)  - Usages</text><text x="50" y="370" font-size="16" fill="#FF0000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Recommendation:</text><text x="194.0" y="370" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> Avoid reserved words (type, id, etc.)</text><text x="50" y="415" font-size="16" fill="#FF0000" font-weight="italic" text-anchor="start" >Rules for naming elements.</text><rect x="30" y="465" width="660.0" height="220" fill="#111111" rx="10" ry="10"  /><text x="50" y="500" font-size="24" fill="#FFE81F" font-weight="bold" text-anchor="start" font-family="'Century Gothic', 'Verdana', sans-serif">2. Import Basics</text><text id="code_9853facaf61c48ef9cdce6b7248d1632" style="display:none;"></text><g onclick="copyToClipboard('code_9853facaf61c48ef9cdce6b7248d1632')" style="cursor: pointer;"><title>package Naming_2Imports {
    package Lib {
        part def Tool;
    }
    
    // Public Import: Visible to importers of Naming_2Imports
    import Lib::*;
    
    // Private Import: Only visible inside this package
    private import ScalarValues::Boolean;
    
    part t : Tool;
    attribute isReady : Boolean;
}</title><rect x="610.0" y="475" width="70" height="30" fill="#FF0000" rx="5" ry="5"  /><text x="645.0" y="495" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="50" y="535" font-size="16" fill="#FF0000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">import</text><text x="107.6" y="535" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : Public import (transitive)</text><text x="50" y="560" font-size="16" fill="#FF0000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">private import</text><text x="184.4" y="560" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : Private to this package</text><text x="50" y="585" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Members of imported package become visible</text><text x="50" y="610" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">No &#x27;include&#x27; - use import</text><text x="50" y="655" font-size="16" fill="#FF0000" font-weight="italic" text-anchor="start" >Bringing elements into scope.</text><rect x="710.0" y="150" width="660.0" height="245" fill="#111111" rx="10" ry="10"  /><text x="730.0" y="185" font-size="24" fill="#FFE81F" font-weight="bold" text-anchor="start" font-family="'Century Gothic', 'Verdana', sans-serif">3. Wildcards &amp; Scope</text><text id="code_d6c9dabe6a834a1c8714dcd01332a26e" style="display:none;"></text><g onclick="copyToClipboard('code_d6c9dabe6a834a1c8714dcd01332a26e')" style="cursor: pointer;"><title>package Naming_3Wildcards {
    package BigLibrary {
        package SubLib { part def InnerThing; }
        part def OuterThing;
    }
    
    // Imports only OuterThing, NOT InnerThing
    import BigLibrary::*; 
    
    // Imports OuterThing AND InnerThing (Recursive)
    // CAUTION: Can cause namespace pollution and conflicts
    // import BigLibrary::**; 
    
    part o : OuterThing;
    // part i : InnerThing; // Error if using *
}</title><rect x="1290.0" y="160" width="70" height="30" fill="#FF0000" rx="5" ry="5"  /><text x="1325.0" y="180" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="730.0" y="220" font-size="16" fill="#FF0000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Specific</text><text x="806.8" y="220" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : import Pkg::Item;</text><text x="730.0" y="245" font-size="16" fill="#FF0000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Shallow *</text><text x="816.4" y="245" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : import Pkg::*; (Direct contents)</text><text x="730.0" y="270" font-size="16" fill="#FF0000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Recursive **</text><text x="845.2" y="270" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : import Pkg::**; (All descendants)</text><text x="730.0" y="295" font-size="16" fill="#FF0000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Warning:</text><text x="806.8" y="295" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> ** can import 1000s of names!</text><text x="730.0" y="320" font-size="16" fill="#FF0000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Best Practice:</text><text x="864.4" y="320" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> Use specific imports to avoid pollution.</text><text x="730.0" y="365" font-size="16" fill="#FF0000" font-weight="italic" text-anchor="start" >Controlling what you import.</text><rect x="710.0" y="415" width="660.0" height="195" fill="#111111" rx="10" ry="10"  /><text x="730.0" y="450" font-size="24" fill="#FFE81F" font-weight="bold" text-anchor="start" font-family="'Century Gothic', 'Verdana', sans-serif">4. Aliasing</text><text id="code_04c41bb152d740c8aa7b7ac61fb513b4" style="display:none;"></text><g onclick="copyToClipboard('code_04c41bb152d740c8aa7b7ac61fb513b4')" style="cursor: pointer;"><title>package Naming_4Aliasing {
    package LibA { part def Widget; }
    package LibB { part def Widget; }
    
    // Conflict resolution
    import LibA::Widget as A_Widget;
    import LibB::Widget as B_Widget;
    
    part w1 : A_Widget;
    part w2 : B_Widget;
}</title><rect x="1290.0" y="425" width="70" height="30" fill="#FF0000" rx="5" ry="5"  /><text x="1325.0" y="445" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="730.0" y="485" font-size="16" fill="#FF0000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">as</text><text x="749.2" y="485" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : Rename imported element in local scope</text><text x="730.0" y="510" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Resolves name conflicts between libraries</text><text x="730.0" y="535" font-size="16" fill="#FFE81F" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Provides shorter names for deep paths</text><text x="730.0" y="580" font-size="16" fill="#FF0000" font-weight="italic" text-anchor="start" >Renaming for clarity or conflict resolution.</text><rect x="450.0" y="1220" width="500" height="50" fill="#111111" rx="5" ry="5"  /><text x="470.0" y="1250" font-size="16" fill="#FFE81F" font-weight="bold" text-anchor="start" >Key:</text><text x="520.0" y="1250" font-size="16" fill="#FF0000" font-weight="bold" text-anchor="start" >Keyword</text><text x="620.0" y="1250" font-size="16" fill="#FFE81F" font-weight="bold" text-anchor="start" >Type</text><text x="690.0" y="1250" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="start" >String</text><text x="780.0" y="1250" font-size="16" fill="#888888" font-weight="bold" text-anchor="start" >Comment</text><text x="880.0" y="1250" font-size="16" fill="#FFE81F" font-weight="bold" text-anchor="start" >Normal</text></svg>