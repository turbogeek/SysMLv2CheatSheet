}</title><rect x="1120" y="400" width="70" height="30" fill="#FF0000" rx="5" ry="5"  /><text x="1155" y="420" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="660" y="460" font-size="16" fill="#FF0000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">view myView {</text><text x="660" y="485" font-size="16" fill="#FF0000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    filter @Part;</text><text x="660" y="510" font-size="16" fill="#FF0000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">    filter @Action;</text><text x="660" y="535" font-size="16" fill="#FF0000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">}</text><text x="660" y="580" font-size="16" fill="#FF0000" font-weight="italic" text-anchor="start" >Filter included elements by criteria.</text><rect x="640" y="630" width="560" height="220" fill="#111111" rx="10" ry="10"  /><text x="660" y="665" font-size="24" fill="#FFE81F" font-weight="bold" text-anchor="start" font-family="'Century Gothic', 'Verdana', sans-serif">6. Rendering &amp; Style</text><text id="code_c607da853d384d508f8ec027fce4e6ba" style="display:none;"></text><g onclick="copyToClipboard('code_c607da853d384d508f8ec027fce4e6ba')" style="cursor: pointer;"><title>package Views {
