<text x="600.0" y="60" font-size="40" fill="#FFE81F" font-weight="bold" text-anchor="middle" font-family="'Century Gothic', 'Verdana', sans-serif">SysML v2 Cheat Sheet: VIEWS &amp; VIEWPOINTS</text><text x="600.0" y="100" font-size="20" fill="#FF0000" font-weight="normal" text-anchor="middle" >Theme: dark_side</text><rect x="40" y="150" width="560" height="195" fill="#111111" rx="10" ry="10"  /><text x="60" y="185" font-size="24" fill="#FFE81F" font-weight="bold" text-anchor="start" font-family="'Century Gothic', 'Verdana', sans-serif">1. View Definition</text><text id="code_f2ae54f524e64f9f80934264e1e48e73" style="display:none;">cGFja2FnZSBWaWV3cyB7CiAgICBwYXJ0IGRlZiBTeXN0ZW07CiAgICAKICAgIHZpZXcgZGVmIFJlcG9ydFZpZXcgewogICAgICAgIC8qIElucHV0IHBhcmFtZXRlciBmb3Igc3ViamVjdCAqLwogICAgICAgIGluIHN1YmplY3QgOiBTeXN0ZW07CiAgICB9Cn0=</text><g onclick="copyToClipboard('code_f2ae54f524e64f9f80934264e1e48e73')" style="cursor: pointer;"><title>package Views {
