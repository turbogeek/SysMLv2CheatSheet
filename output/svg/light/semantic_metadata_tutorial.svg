<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1400" height="1300" viewBox="0 0 1400 1300" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Consolas', 'Monaco', 'Courier New', monospace; background-color: #FFFFFF;">

    <script type="text/javascript">
    <![CDATA[
    function copyToClipboard(elementId) {
        var text = document.getElementById(elementId).textContent;
        // Decode base64 if we use it, but plain text is easier if escaped. 
        // Let's assume standard text content for now, maybe base64 decoded if needed.
        // Actually, let's use base64 to avoid escaping hell in attributes.
        var decoded = atob(text);
        
        navigator.clipboard.writeText(decoded).then(function() {
            console.log('Copying to clipboard was successful!');
            alert('Example copied to clipboard!');
        }, function(err) {
            console.error('Could not copy text: ', err);
            alert('Failed to copy. ' + err);
        });
    }
    ]]>
    </script>
    <text x="700.0" y="60" font-size="40" fill="#000000" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Arial', sans-serif">SysML v2 Cheat Sheet: SEMANTIC METADATA (DSL)</text><text x="700.0" y="100" font-size="20" fill="#555555" font-weight="normal" text-anchor="middle" >Theme: light</text><rect x="30" y="150" width="660.0" height="195" fill="#F0F0F0" rx="10" ry="10"  /><text x="50" y="185" font-size="24" fill="#2B91AF" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">1. Domain Library</text><text id="code_f04ea7040a24416b88e65cf5ed361a5a" style="display:none;"></text><g onclick="copyToClipboard('code_f04ea7040a24416b88e65cf5ed361a5a')" style="cursor: pointer;"><title>package Vehicle_Library {
    port def DrivePort {
        out attribute torque : ISQ::TorqueValue;
    }
    part def Engine {
        port enginePort : DrivePort;
    }
    part engines : Engine [0..*];
    part def Wheel {
        port wheelPort : ~DrivePort;
    }
    part wheels : Wheel [0..*];
    interface def DriveTrain {
        end [0..1] port drivePort : DrivePort;
        end [0..*] port drivenPort : ~DrivePort;
    }
    abstract interface driveTrains : DriveTrain [0..*];
    
    part def Vehicle {
        part :&gt;&gt; engines;
        part :&gt;&gt; wheels;
        part :&gt;&gt; driveTrains;
    }
}</title><rect x="610.0" y="160" width="70" height="30" fill="#0000FF" rx="5" ry="5"  /><text x="645.0" y="180" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="50" y="220" font-size="16" fill="#008000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="italic" xml:space="preserve">Pre-requisite:</text><text x="184.4" y="220" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> Define your domain concepts first.</text><text x="50" y="245" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">These are standard SysML definitions.</text><text x="50" y="270" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Metadata will map to these concepts.</text><text x="50" y="315" font-size="16" fill="#555555" font-weight="italic" text-anchor="start" >The vocabulary we want to use.</text><rect x="30" y="365" width="660.0" height="220" fill="#F0F0F0" rx="10" ry="10"  /><text x="50" y="400" font-size="24" fill="#2B91AF" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">2. Defining Metadata</text><text id="code_adc81998b38a4fdda32a5d19c6bb6418" style="display:none;"></text><g onclick="copyToClipboard('code_adc81998b38a4fdda32a5d19c6bb6418')" style="cursor: pointer;"><title>package Vehicle_Metadata {
    private import Vehicle_Library::*;
    private import Metaobjects::SemanticMetadata;

    metadata def drive :&gt; SemanticMetadata {
        :&gt;&gt; baseType = driveTrains meta SysML::Usage;
        :&gt; annotatedElement : SysML::InterfaceUsage;
    }
    metadata def engine :&gt; SemanticMetadata {
        :&gt;&gt; baseType = engines meta SysML::Usage;
        :&gt; annotatedElement : SysML::Usage;
    }
    metadata def wheel :&gt; SemanticMetadata {
        :&gt;&gt; baseType = wheels meta SysML::Usage;
        :&gt; annotatedElement : SysML::Usage;
    }
    metadata def vehicle :&gt; SemanticMetadata {
        :&gt;&gt; baseType = Vehicle meta SysML::Definition;
        :&gt; annotatedElement : SysML::Definition;
    }
}</title><rect x="610.0" y="375" width="70" height="30" fill="#0000FF" rx="5" ry="5"  /><text x="645.0" y="395" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="50" y="435" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">metadata def</text><text x="165.2" y="435" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : Defines a new annotation type.</text><text x="50" y="460" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">specializes SemanticMetadata</text><text x="318.8" y="460" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : Required for semantic mapping.</text><text x="50" y="485" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">baseType</text><text x="126.8" y="485" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : The Domain Concept this metadata represents.</text><text x="50" y="510" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">annotatedElement</text><text x="203.6" y="510" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : Where this metadata can be applied.</text><text x="50" y="555" font-size="16" fill="#555555" font-weight="italic" text-anchor="start" >Mapping keywords to concepts.</text><rect x="710.0" y="150" width="660.0" height="270" fill="#F0F0F0" rx="10" ry="10"  /><text x="730.0" y="185" font-size="24" fill="#2B91AF" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">3. Using the DSL</text><text id="code_14dc29eaef9c41cdb529a173d8fe14e9" style="display:none;"></text><g onclick="copyToClipboard('code_14dc29eaef9c41cdb529a173d8fe14e9')" style="cursor: pointer;"><title>package Car_Example {
    private import Vehicle_Metadata::*;
    
    #vehicle def Car {
        #engine carEngine [1];
        #wheel carWheels [4];
        
        #drive interface [1] carEngine.enginePort to [2] carWheels.wheelPort;
    }
}</title><rect x="1290.0" y="160" width="70" height="30" fill="#0000FF" rx="5" ry="5"  /><text x="1325.0" y="180" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="730.0" y="220" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">#hash</text><text x="778.0" y="220" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> syntax applies the metadata.</text><text x="730.0" y="245" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">The parser treats:</text><text x="730.0" y="270" font-size="16" fill="#A31515" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  #vehicle def Car</text><text x="730.0" y="295" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">as equivalent to:</text><text x="730.0" y="320" font-size="16" fill="#A31515" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  part def Car :&gt; Vehicle</text><text x="730.0" y="345" font-size="16" fill="#008000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="italic" xml:space="preserve">(plus semantic tagging)</text><text x="730.0" y="390" font-size="16" fill="#555555" font-weight="italic" text-anchor="start" >Writing concise, domain-specific code.</text><rect x="710.0" y="440" width="660.0" height="270" fill="#F0F0F0" rx="10" ry="10"  /><text x="730.0" y="475" font-size="24" fill="#2B91AF" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">4. Behind the Scenes</text><text id="code_ecb3154c291d419ba78839bd4473aab0" style="display:none;"></text><g onclick="copyToClipboard('code_ecb3154c291d419ba78839bd4473aab0')" style="cursor: pointer;"><title>// Conceptual view of what happens under the hood
// When you write:
// #engine myEngine;

// It effectively becomes:
// @engine
// part myEngine :&gt; engines;

// Where @engine links back to the metadata definition
// allowing tools to know &quot;This part IS an engine&quot;
// regardless of inheritance hierarchy complexities.</title><rect x="1290.0" y="450" width="70" height="30" fill="#0000FF" rx="5" ry="5"  /><text x="1325.0" y="470" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="730.0" y="510" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">meta</text><text x="768.4" y="510" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> keyword: explicit reference to a metaclass.</text><text x="730.0" y="535" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  e.g., meta SysML::Usage</text><text x="730.0" y="560" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Benefits:</text><text x="730.0" y="585" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  1. Concise syntax (#engine vs part :&gt; engine)</text><text x="730.0" y="610" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  2. Semantic Validation (only engines here)</text><text x="730.0" y="635" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">  3. Tooling (custom views/generators)</text><text x="730.0" y="680" font-size="16" fill="#555555" font-weight="italic" text-anchor="start" >Why do this?</text><rect x="450.0" y="1220" width="500" height="50" fill="#F0F0F0" rx="5" ry="5"  /><text x="470.0" y="1250" font-size="16" fill="#000000" font-weight="bold" text-anchor="start" >Key:</text><text x="520.0" y="1250" font-size="16" fill="#0000FF" font-weight="bold" text-anchor="start" >Keyword</text><text x="620.0" y="1250" font-size="16" fill="#2B91AF" font-weight="bold" text-anchor="start" >Type</text><text x="690.0" y="1250" font-size="16" fill="#A31515" font-weight="bold" text-anchor="start" >String</text><text x="780.0" y="1250" font-size="16" fill="#008000" font-weight="bold" text-anchor="start" >Comment</text><text x="880.0" y="1250" font-size="16" fill="#000000" font-weight="bold" text-anchor="start" >Normal</text></svg>