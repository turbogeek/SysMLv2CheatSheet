<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1400" height="1300" viewBox="0 0 1400 1300" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Consolas', 'Monaco', 'Courier New', monospace; background-color: #FFFFFF;">

    <script type="text/javascript">
    <![CDATA[
    function copyToClipboard(elementId) {
        var text = document.getElementById(elementId).textContent;
        // Decode base64 if we use it, but plain text is easier if escaped. 
        // Let's assume standard text content for now, maybe base64 decoded if needed.
        // Actually, let's use base64 to avoid escaping hell in attributes.
        var decoded = atob(text);
        
        navigator.clipboard.writeText(decoded).then(function() {
            console.log('Copying to clipboard was successful!');
            alert('Example copied to clipboard!');
        }, function(err) {
            console.error('Could not copy text: ', err);
            alert('Failed to copy. ' + err);
        });
    }
    ]]>
    </script>
    <text x="700.0" y="60" font-size="40" fill="#000000" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Arial', sans-serif">SysML v2 Cheat Sheet: FEATURES &amp; REDEFINITION</text><text x="700.0" y="100" font-size="20" fill="#555555" font-weight="normal" text-anchor="middle" >Theme: light</text><rect x="30" y="150" width="660.0" height="220" fill="#F0F0F0" rx="10" ry="10"  /><text x="50" y="185" font-size="24" fill="#2B91AF" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">1. What is a Feature?</text><text id="code_f0a633e31d854585bacf3515c32ff336" style="display:none;">cGFja2FnZSBGZWF0dXJlX0Jhc2ljcyB7CiAgICBwYXJ0IGRlZiBDYXIgewogICAgICAgIC8vIFN0cnVjdHVyYWwgRmVhdHVyZXMKICAgICAgICBhdHRyaWJ1dGUgdmluIDogU3RyaW5nOwogICAgICAgIHBhcnQgZW5naW5lIDogRW5naW5lOwogICAgICAgIAogICAgICAgIC8vIEJlaGF2aW9yYWwgRmVhdHVyZXMKICAgICAgICBhY3Rpb24gZHJpdmU7CiAgICB9Cn0=</text><g onclick="copyToClipboard('code_f0a633e31d854585bacf3515c32ff336')" style="cursor: pointer;"><title>package Feature_Basics {
    part def Car {
        // Structural Features
        attribute vin : String;
        part engine : Engine;
        
        // Behavioral Features
        action drive;
    }
}</title><rect x="610.0" y="160" width="70" height="30" fill="#0000FF" rx="5" ry="5"  /><text x="645.0" y="180" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="50" y="220" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Features</text><text x="126.8" y="220" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> are the structural and behavioral elements.</text><text x="50" y="245" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Structure:</text><text x="146.0" y="245" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> attributes, parts, ports.</text><text x="50" y="270" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Behavior:</text><text x="136.39999999999998" y="270" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> actions, steps.</text><text x="50" y="295" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">All features can be typed, valued, and related.</text><text x="50" y="340" font-size="16" fill="#555555" font-weight="italic" text-anchor="start" >The building blocks of definitions.</text><rect x="30" y="390" width="660.0" height="195" fill="#F0F0F0" rx="10" ry="10"  /><text x="50" y="425" font-size="24" fill="#2B91AF" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">2. Subsetting</text><text id="code_c44269e3a558402d8a046d2aae5ce833" style="display:none;"></text><g onclick="copyToClipboard('code_c44269e3a558402d8a046d2aae5ce833')" style="cursor: pointer;"><title>package Subsetting_Example {
    part def Vehicle {
        part wheels[4];
    }
    
    part def Car :&gt; Vehicle {
        // &#x27;frontWheels&#x27; is a specific subset of &#x27;wheels&#x27;
        part frontWheels[2] subsets wheels;
        
        // &#x27;rearWheels&#x27; is another subset
        part rearWheels[2] subsets wheels;
        
        // Total items in subsets cannot exceed superset multiplicity
    }
}</title><rect x="610.0" y="400" width="70" height="30" fill="#0000FF" rx="5" ry="5"  /><text x="645.0" y="420" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="50" y="460" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">subsets</text><text x="117.2" y="460" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : Declares that a feature is a specific case of another.</text><text x="50" y="485" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Usage:</text><text x="107.6" y="485" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> Grouping or classification.</text><text x="50" y="510" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Constraint:</text><text x="155.6" y="510" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> The subset must be consistent with the superset.</text><text x="50" y="555" font-size="16" fill="#555555" font-weight="italic" text-anchor="start" >Classification and grouping.</text><rect x="710.0" y="150" width="660.0" height="195" fill="#F0F0F0" rx="10" ry="10"  /><text x="730.0" y="185" font-size="24" fill="#2B91AF" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">3. Redefinition</text><text id="code_5878b99d07c3414db9062ad93fc14f41" style="display:none;"></text><g onclick="copyToClipboard('code_5878b99d07c3414db9062ad93fc14f41')" style="cursor: pointer;"><title>package Redefinition_Example {
    part def Vehicle {
        part engine : Engine;
    }
    
    part def ElectricCar :&gt; Vehicle {
        // Replace the generic Engine with an ElectricMotor
        // Multiplicity or Type can change
        part redefines engine : ElectricMotor;
    }
    
    part def ElectricMotor :&gt; Engine;
    part def Engine;
}</title><rect x="1290.0" y="160" width="70" height="30" fill="#0000FF" rx="5" ry="5"  /><text x="1325.0" y="180" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="730.0" y="220" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">redefines</text><text x="816.4" y="220" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : Replaces an inherited feature with a new one.</text><text x="730.0" y="245" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Usage:</text><text x="787.6" y="245" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> Changing types or multiplicity in subclasses.</text><text x="730.0" y="270" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">Result:</text><text x="797.2" y="270" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> The original feature is hidden/replaced.</text><text x="730.0" y="315" font-size="16" fill="#555555" font-weight="italic" text-anchor="start" >Modifying inherited structure.</text><rect x="710.0" y="365" width="660.0" height="220" fill="#F0F0F0" rx="10" ry="10"  /><text x="730.0" y="400" font-size="24" fill="#2B91AF" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Arial', sans-serif">4. Redeclaration (:&gt;&gt;)</text><text id="code_18c6087856f3460cae31f95ae3658361" style="display:none;"></text><g onclick="copyToClipboard('code_18c6087856f3460cae31f95ae3658361')" style="cursor: pointer;"><title>package Redeclaration_Example {
    part def Spacecraft {
        part module;
    }
    
    part def Lander :&gt; Spacecraft {
        // Add details to the inherited &#x27;module&#x27;
        // Equivalent to: part module :&gt;&gt; module { ... }
        part :&gt;&gt; module {
            attribute mass = 500 [ISQ::kg];
        }
    }
}</title><rect x="1290.0" y="375" width="70" height="30" fill="#0000FF" rx="5" ry="5"  /><text x="1325.0" y="395" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >COPY</text></g><text x="730.0" y="435" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">:&gt;&gt;</text><text x="758.8" y="435" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> : The &#x27;redeclaration&#x27; operator.</text><text x="730.0" y="460" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">This is shorthand for </text><text x="941.2" y="460" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">subsets</text><text x="1008.4000000000001" y="460" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve"> or </text><text x="1046.8000000000002" y="460" font-size="16" fill="#0000FF" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">redefines</text><text x="730.0" y="485" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">depending on context (usually subsets by default).</text><text x="730.0" y="510" font-size="16" fill="#000000" font-weight="normal" text-anchor="start" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-style="normal" xml:space="preserve">It allows adding Detail without restating keywords.</text><text x="730.0" y="555" font-size="16" fill="#555555" font-weight="italic" text-anchor="start" >Adding detail to inherited features.</text><rect x="450.0" y="1220" width="500" height="50" fill="#F0F0F0" rx="5" ry="5"  /><text x="470.0" y="1250" font-size="16" fill="#000000" font-weight="bold" text-anchor="start" >Key:</text><text x="520.0" y="1250" font-size="16" fill="#0000FF" font-weight="bold" text-anchor="start" >Keyword</text><text x="620.0" y="1250" font-size="16" fill="#2B91AF" font-weight="bold" text-anchor="start" >Type</text><text x="690.0" y="1250" font-size="16" fill="#A31515" font-weight="bold" text-anchor="start" >String</text><text x="780.0" y="1250" font-size="16" fill="#008000" font-weight="bold" text-anchor="start" >Comment</text><text x="880.0" y="1250" font-size="16" fill="#000000" font-weight="bold" text-anchor="start" >Normal</text></svg>